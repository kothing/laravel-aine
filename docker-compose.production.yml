# ===========================================================================
# Aine CMS - production deployment
#
# Usage:
#   1. Copy .env.example and set production values (DB_*, APP_URL, ...)
#      cp .env.example .env
#   2. Build & start (daemon):
#      docker compose -f docker-compose.production.yml up -d --build
#   3. First-run setup: open https://your-domain/install in a browser and
#      follow the web installer. It will create the storage/installed marker.
#
# Notes:
#   - The app image is self-contained (no source mount) - rebuild it to deploy
#     new code: docker compose -f docker-compose.production.yml build app
#   - Database credentials come from the host .env via ${DB_*} variables.
# ===========================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aine-app:latest
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-aine}
      DB_USERNAME: ${DB_USERNAME:-aine}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-8}
    volumes:
      - aine-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - aine

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    volumes_from:
      - app:ro
    depends_on:
      - app
    networks:
      - aine

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-aine}
      MYSQL_USER: ${DB_USERNAME:-aine}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - aine-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${DB_ROOT_PASSWORD:-secret} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - aine

networks:
  aine:
    driver: bridge

volumes:
  aine-storage:
  aine-mysql:
