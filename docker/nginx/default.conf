server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Keep in sync with upload_max_filesize (php.ini) - 8M uploads + base64 safety margin
    client_max_body_size 16m;

    # SPA/admin history-mode routing -> Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Hashed Vite assets (public/build/*) - cache hard
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other static assets - short cache
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # PHP
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS off;
    }

    # Never serve dotfiles (e.g. .env if ever copied)
    location ~ /\. {
        deny all;
    }
}
